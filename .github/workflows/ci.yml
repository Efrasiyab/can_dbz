name: CI

on:
  push:
  pull_request:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src tests
      - name: Build
        run: zig build
      - name: Run unit tests
        run: zig build test test-smoke
